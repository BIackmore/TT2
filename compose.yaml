services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tt2_postgres
    restart: always
    environment:
      POSTGRES_DB: tepozteco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ia:
    build:
      context: ./Modulos_IA_TT
    container_name: tt2_ia
    restart: always
    ports:
      - "5000:5000"

  backend:
    build:
      context: ./backend
    container_name: tt2_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tepozteco
      DB_USER: postgres
      DB_PASSWORD: postgres

      IA_URL: http://ia:5000
      JWT_SECRET: secreto_desarrollo

    depends_on:
      - postgres
      - ia

  frontend:
    build:
      context: ./frontend
    container_name: tt2_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: